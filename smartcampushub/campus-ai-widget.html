<div class="campus-ai-widget" id="campusAIWidget">
  <div class="campus-ai-window" id="campusAIWindow">
    <div class="campus-ai-header">
      <div class="campus-ai-header-left">
        <span class="campus-ai-avatar">AI</span>
        <div>
          <div class="campus-ai-title">Campus AI</div>
          <div class="campus-ai-subtitle">Smart Campus Assistant</div>
        </div>
      </div>
      <button type="button" class="campus-ai-close" id="campusAIClose" aria-label="Close">
        ×
      </button>
    </div>

    <div class="campus-ai-messages" id="campusAIMessages">
      <div class="campus-ai-message bot">
        <div class="campus-ai-bubble">
          Hi! I’m Campus AI. Ask about classes, exams, attendance or events.
          <span class="campus-ai-timestamp">Now</span>
        </div>
      </div>
    </div>

    <div class="campus-ai-typing" id="campusAITyping">
      <span></span><span></span><span></span>
    </div>

    <form class="campus-ai-form" id="campusAIForm">
      <input type="text" class="campus-ai-input" id="campusAIInput" placeholder="Ask Campus AI..." autocomplete="off" />
      <button type="submit" class="campus-ai-send" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 20l18-8-18-8v6l12 2-12 2z" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
    </form>
  </div>

  <div class="campus-ai-label">Campus AI</div>
  <button type="button" class="campus-ai-launcher" id="campusAILauncher" aria-label="Open Campus AI">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 12a8 8 0 1 0 16 0 8 8 0 0 0-16 0z" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M8 14c1 2 2 3 4 3s3-1 4-3" fill="none" stroke="currentColor" stroke-width="2" />
      <circle cx="9" cy="10" r="1" fill="currentColor" />
      <circle cx="13" cy="10" r="1" fill="currentColor" />
    </svg>
  </button>
</div>
